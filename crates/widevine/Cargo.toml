[package]
name = "widevine"
version = "0.1.0"
edition = "2024"

[features]
serde = ["dep:serde"]

[dependencies]
aes = "0.9.4"
byteorder = "1.5"
cbc = { version = "0.2.1", features = ["alloc"] }
cmac = "0.8"
data-encoding = "2.11.1"
hmac = "0.13"
num-derive = "0.5.1"
num-traits = "0.2.19"
protobuf = "3.7.2"
rsa = "0.10"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"], optional = true }
sha1 = "0.11"
sha2 = "0.11.1"
thiserror = "2.0.21"
widevine-proto = { path = "../widevine-proto" }

[dev-dependencies]
path_macro = "1"
serde_json = "1.0.154"
temp_testdir = "0.2.3"
