[package]
name = "dcv-decryptor"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/widevine", "crates/widevine-proto"]
resolver = "3"

[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true        # 启用链接时优化。
opt-level = "s"   # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic = "abort"   # 通过禁用 panic 处理程序来提高性能。
strip = true      # 确保移除调试符号。

[dependencies]
# Widevine 相关
widevine = { path = "crates/widevine" }
widevine-proto = { path = "crates/widevine-proto" }
pssh-box = "0.2.5"

# RSA
rsa = "0.10.0"

# HTTP 客户端
reqwest = { version = "0.13.5", features = ["blocking", "json", "form"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

# 命令行
clap = { version = "4.6.9", features = ["derive"] }
inquire = "0.9.5"
loading = "0.4.0"
boxen = "0.4.0"

# JSON 和编码
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
hex = "0.4.3"
regex = "1.13.2"

# JWT
jsonwebtoken = { version = "12.0.0", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }

# 错误处理
anyhow = "1.0.104"
mp4decrypt = "0.6.1"
